# The agent that works on this repository, run by Canopy
# (github.com/alee792/canopy). Try it with `canopy dev agent/`; publish a
# version with `canopy push agent/`. See Canopy's docs/agents.md.
name: console-dev
description: Works on substrate-console, the MCP App console for Substrate clusters.
harness: claude-code
model: claude-opus-5-5
effort: high

policy:
  default: allow
  tools:
    web_fetch: ask

environment:
  network:
    access: limited
    allowed_domains:
      - github.com
      - codeload.github.com
      - objects.githubusercontent.com
      - proxy.golang.org
      - sum.golang.org
      - storage.googleapis.com
      - registry.npmjs.org
  setup:
    - cd substrate-console && go mod download && cd web && npm ci --no-audit --no-fund

workspace:
  repos:
    - url: https://github.com/alee792/substrate-console
      ref: main
      path: substrate-console
