name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the view
        working-directory: web
        run: npm ci && npm run build && npx tsc --noEmit -p .
      - name: Committed dist matches the source
        run: git diff --exit-code -- web/dist
      - run: go vet ./...
      - run: go test ./...
