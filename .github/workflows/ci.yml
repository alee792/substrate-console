name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # substrate-fake is fetched straight from GitHub. While it is private,
      # a FAKE_REPO_TOKEN secret (read access to it) lets git through.
      GOPRIVATE: github.com/alee792/substrate-fake
    steps:
      - name: GitHub access for private modules
        env:
          TOKEN: ${{ secrets.FAKE_REPO_TOKEN }}
        if: env.TOKEN != ''
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the view
        working-directory: web
        run: npm ci && npm run build && npx tsc --noEmit -p .
      - name: Committed dist matches the source
        run: git diff --exit-code -- web/dist
      - run: go vet ./...
      - run: go test ./...
