:root { --bg: #fbfbfa; --fg: #111110; --muted: #77776f; --line: #d6d5ce; --surface: #fff; color-scheme: light; }

.ask-panel .row { display: flex; gap: .5rem; }
.ask-panel button { font: 500 12px/1 inherit; padding: .45rem .7rem; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.ask-panel button.pri { background: var(--fg); color: var(--bg); border-color: var(--fg); }
